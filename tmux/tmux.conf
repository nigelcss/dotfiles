set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

set -g mouse on

unbind C-b
set -g prefix C-a
# Double-tap the prefix to jump to the next Claude Code or nvim pane in this session.
bind C-a run-shell "/Users/nigel.slack-smith/.config/tmux/scripts/tmux-claude-nvim-next.sh"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set-option -g allow-passthrough on

# Session switcher showing each session's Claude status (idle/waiting/running)
# from the rollup options (@claude_session_state / @claude_session_prio set by
# ~/.claude/hooks/tmux-status.sh). Sessions that never ran Claude show no suffix.
bind-key s run-shell "/Users/nigel.slack-smith/.config/tmux/scripts/tmux-session-tree.sh"

bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.config reloaded"
bind-key M split-window -h "nvim ~/.config/tmux/tmux.conf"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n M-h if-shell "$is_vim" "send-keys M-h"  "resize-pane -L 6"
bind-key -n M-j if-shell "$is_vim" "send-keys M-j"  "resize-pane -D 3"
bind-key -n M-k if-shell "$is_vim" "send-keys M-k"  "resize-pane -U 3"
bind-key -n M-l if-shell "$is_vim" "send-keys M-l"  "resize-pane -R 6"

bind-key -T copy-mode-vi M-h resize-pane -L 6
bind-key -T copy-mode-vi M-j resize-pane -D 3
bind-key -T copy-mode-vi M-k resize-pane -U 3
bind-key -T copy-mode-vi M-l resize-pane -R 6

# Each picker takes the window it was invoked from as $1 and excludes that
# window's panes from the list, so we never offer a jump to where we already
# are. The popup is launched via run-shell rather than bound to display-popup
# directly because display-popup does NOT expand #{...} formats in its command,
# whereas run-shell does — that expansion is the only way to hand the picker the
# invoking window (inside a popup TMUX_PANE is unset, and `display-message -p`
# with no target resolves to an arbitrary client's window, not the invoker's).

# Fuzzy-pick an active Claude pane in a centered popup and jump to it.
bind e run-shell "tmux display-popup -E -w 91 -h 70% -x C -y C -t '#{pane_id}' \"/Users/nigel.slack-smith/.claude/hooks/tmux-claude-fzf.sh '#{window_id}'\""

# Fuzzy-pick a pane running nvim in a centered popup and jump to it.
bind v run-shell "tmux display-popup -E -w 91 -h 70% -x C -y C -t '#{pane_id}' \"/Users/nigel.slack-smith/.config/tmux/scripts/tmux-nvim-fzf.sh '#{window_id}'\""

# Fuzzy-pick a pane running a dev server (overmind / make run) and jump to it.
bind g run-shell "tmux display-popup -E -w 91 -h 70% -x C -y C -t '#{pane_id}' \"/Users/nigel.slack-smith/.config/tmux/scripts/tmux-run-fzf.sh '#{window_id}'\""

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'egel/tmux-gruvbox'

set -g @tmux-gruvbox 'dark' 

run '~/.config/tmux/plugins/tpm/tpm'

set-option -g status-position top

set -g status-left "#[bg=colour241,fg=colour248] #S #(~/.config/tmux/scripts/tmux-git-branch.sh)#[bg=colour237,fg=colour241,nobold,noitalics,nounderscore]"

# Prepend a global Claude session-count (idle/waiting/running, zero counts
# hidden) to the theme's status-right. This runs AFTER tpm so it intentionally
# overrides the gruvbox theme's status-right; the theme's original date/host
# segments are appended UNCHANGED. The count is fed by tmux-session-counts.sh,
# which tallies each session's @claude_session_prio option.
#
# tmux-reconcile.sh runs first (on every status-interval) and emits nothing; it
# self-heals stale state by clearing any pane whose Claude process has died
# without firing Stop/SessionEnd (e.g. killed pane, closed terminal, crash),
# so panes can't stay stuck on "running" forever.
#
# tmux-claude-usage.sh shows the claude.ai account's current session/week
# rate-limit usage (from `claude -p "/usage"`). That call is a real network
# round trip and counts as usage itself, so the script caches its result and
# only refreshes in the background every 5 minutes; every status-interval tick
# just reads the cache, so this never blocks the status bar redraw.
set -g status-right "#(~/.claude/hooks/tmux-reconcile.sh)#(~/.claude/hooks/tmux-session-counts.sh)#(~/.config/tmux/scripts/tmux-claude-usage.sh)#(~/.config/tmux/scripts/tmux-nvim-status.sh)#(~/.config/tmux/scripts/tmux-run-status.sh)#(~/.config/tmux/scripts/tmux-disk-status.sh)#[bg=colour237,fg=colour239 nobold, nounderscore, noitalics]#[bg=colour239,fg=colour246] %Y-%m-%d  %H:%M #[bg=colour239,fg=colour248,nobold,noitalics,nounderscore]#[bg=colour248,fg=colour237] #h "

# Refresh the status bar (and thus re-run the #(...) count script) every 5s;
# #(...) output is only re-evaluated on this interval.
set -g status-interval 5

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Claude Code per-window activity state.
# These run AFTER the gruvbox theme loads, so we REPLICATE the theme's powerline
# window tabs (index, name, zoom flag, same  separators + gruvbox palette) and
# APPEND a color-coded Claude pill. The pill renders only when @claude_prio is
# set on a pane (set by ~/.claude/hooks/tmux-status.sh):
#   prio 2 = waiting -> orange 208 "◐ waiting"
#   prio 1 = running -> green 142  "● running"
#   prio 0 = idle    -> gray 241   "○ idle"
# Base tab bg differs (239 inactive / 214 current), so each format builds its
# pill separators against the matching base color.
set -g window-status-format "#[bg=colour239,fg=colour237,noitalics]#[bg=colour239,fg=colour223] #I #[bg=colour239,fg=colour223] #W#{?#{!=:#{@claude_prio},}, #{?#{==:#{@claude_prio},2},#[bg=colour208#,fg=colour239#,nobold#,noitalics#,nounderscore]#[bg=colour208#,fg=colour235#,nobold#,blink#,noitalics#,nounderscore] ◐ waiting #[bg=colour239#,fg=colour208#,nobold#,noitalics#,nounderscore],#{?#{==:#{@claude_prio},1},#[bg=colour142#,fg=colour239#,nobold#,noitalics#,nounderscore]#[bg=colour142#,fg=colour235#,nobold#,noitalics#,nounderscore] ● running #[bg=colour239#,fg=colour142#,nobold#,noitalics#,nounderscore],#[bg=colour241#,fg=colour239#,nobold#,noitalics#,nounderscore]#[bg=colour241#,fg=colour223#,nobold#,noitalics#,nounderscore] ○ idle #[bg=colour239#,fg=colour241#,nobold#,noitalics#,nounderscore]}},} #[bg=colour237,fg=colour239,noitalics]"
set -g window-status-current-format "#[bg=colour214,fg=colour237,nobold,noitalics,nounderscore]#[bg=colour214,fg=colour239] #I #[bg=colour214,fg=colour239,bold] #W#{?window_zoomed_flag,*Z,}#{?#{!=:#{@claude_prio},}, #{?#{==:#{@claude_prio},2},#[bg=colour208#,fg=colour214#,nobold#,noitalics#,nounderscore]#[bg=colour208#,fg=colour235#,nobold#,blink#,noitalics#,nounderscore] ◐ waiting #[bg=colour214#,fg=colour208#,nobold#,noitalics#,nounderscore],#{?#{==:#{@claude_prio},1},#[bg=colour142#,fg=colour214#,nobold#,noitalics#,nounderscore]#[bg=colour142#,fg=colour235#,nobold#,noitalics#,nounderscore] ● running #[bg=colour214#,fg=colour142#,nobold#,noitalics#,nounderscore],#[bg=colour241#,fg=colour214#,nobold#,noitalics#,nounderscore]#[bg=colour241#,fg=colour223#,nobold#,noitalics#,nounderscore] ○ idle #[bg=colour214#,fg=colour241#,nobold#,noitalics#,nounderscore]}},} #[bg=colour237,fg=colour214,nobold,noitalics,nounderscore]"
